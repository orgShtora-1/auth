name: Bug report
description: Report a reproducible problem in the package.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Before submitting, search existing issues and remove credentials or personal data from examples.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Next.js
        - Cloudflare Workers
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample and steps that reproduce the issue.
      render: ts
    validations:
      required: true
